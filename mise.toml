# mise tool manifest (shared between macOS and Linux).
# install.sh symlinks this file to ~/.config/mise/config.toml so it is
# the global mise configuration on the host.
#
# Backends:
#   - aqua/ubi: prebuilt GitHub release binaries (no toolchain required)
#   - core: mise built-in language runtimes
#
# To pin a version, replace "latest" with a concrete version string.

[tools]
# Languages and package managers
node = "lts"
bun = "latest"
go = "latest"
java = "21"
python = "3.14"
uv = "latest"

# Build tools
maven = "latest"

# Shell experience
"aqua:starship/starship" = "latest"
"aqua:ajeetdsouza/zoxide" = "latest"
"aqua:sxyazi/yazi" = "latest"
"aqua:junegunn/fzf" = "latest"
"aqua:sharkdp/fd" = "latest"
"aqua:BurntSushi/ripgrep" = "latest"
"aqua:jqlang/jq" = "latest"
"aqua:neovim/neovim" = "latest"
"aqua:ClementTsang/bottom" = "latest"

# Git tooling
"aqua:cli/cli" = "latest" # gh
"aqua:dandavison/delta" = "latest" # git-delta
"aqua:jesseduffield/lazygit" = "latest"
"npm:git-open" = "latest"

# AI
herdr = "latest"
"npm:agent-browser" = "latest"
codex = "latest"
pi = "latest"
"github:can1357/oh-my-pi" = { version = "latest", rename_exe = "omp" }
# @opencode/cli ships a 229-byte stub as `bin/opencode.exe` and relies on its
# postinstall to link the real platform binary. mise's bun installer skips
# lifecycle scripts by default, so the stub survives and every run fails with
# "postinstall script was not run". Run that one script explicitly instead of
# opening up all dependency scripts with `bun_args = "--trust"`.
"npm:@opencode/cli" = { version = "latest", postinstall = "node $MISE_TOOL_INSTALL_PATH/node_modules/@opencode/cli/postinstall.mjs" }
grok = { version = "latest", bin = "grok", platforms = { windows-arm64 = { bin = "grok.exe", url = "https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-windows-aarch64.exe" }, windows-x64 = { bin = "grok.exe", url = "https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-windows-x86_64.exe" } }, url = 'https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-{{ os() }}-{{ arch(x64="x86_64", arm64="aarch64") }}', version_list_url = "https://x.ai/cli/stable" }

# Spec-driven development
"npm:@fission-ai/openspec" = "latest"

# Collaboration
"npm:@larksuite/cli" = "latest"

# Containers
lazydocker = "latest"

[settings]
# Avoid installing newly published releases until they have been available for 24 hours.
# Override once when needed: mise upgrade <tool> --minimum-release-age 0
minimum_release_age = "24h"
# Trust this config when symlinked into ~/.config/mise/config.toml.
# (mise prompts on first use of repo-local configs; the global file is
# implicitly trusted, but we set this explicitly for clarity.)
experimental = true

[settings.npm]
package_manager = "bun"

[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'
