onboarding = false

[theme]
name = "catppuccin"

[keys]
prefix = "ctrl+b"

# Mode actions
copy_mode = ["prefix+[", "alt+f"]
resize_mode = "prefix+r"
edit_scrollback = "prefix+e"

# Direct pane navigation
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]

# Direct tab, workspace, and agent navigation
previous_tab = ["prefix+p", "alt+[", "alt+shift+left"]
next_tab = ["prefix+n", "alt+]", "alt+shift+right"]
previous_workspace = ["alt+shift+[", "alt+shift+up"]
next_workspace = ["alt+shift+]", "alt+shift+down"]
previous_agent = "alt+a"
next_agent = "alt+s"

# Pane actions
split_vertical = ["prefix+v", "alt+d"]
split_horizontal = ["prefix+minus", "alt+shift+d"]
close_pane = ["prefix+x", "alt+w"]
rename_pane = ""
fullscreen = ["prefix+z", "prefix+f"]

# Workspace and tab actions
new_workspace = ["prefix+shift+n", "alt+n"]
rename_workspace = ["prefix+shift+w", "alt+shift+n"]
close_workspace = ["prefix+shift+d", "alt+shift+x"]
new_tab = ["prefix+c", "alt+t"]
rename_tab = ""
close_tab = ""

# Global actions
toggle_sidebar = "prefix+b"
reload_config = "prefix+shift+r"
open_notification_target = ""
detach = "prefix+q"

[[keys.command]]
key = "cmd+shift+g"
command = "lazygit"
type = "pane"
description = "open lazygit"

[[keys.command]]
key = "cmd+shift+e"
command = "nvim"
type = "pane"
description = "open nvim"

[[keys.command]]
key = "cmd+shift+c"
type = "shell"
command = "\"$HOME/.local/bin/herdr-copy-transcript\" \"$HERDR_ACTIVE_PANE_ID\" | { if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; else exit 127; fi; } && \"$HERDR_BIN_PATH\" notification show \"copied transcript\""
description = "copy full transcript"

[ui]
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
agent_panel_sort = "spaces"

[ui.toast]
delivery = "herdr"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
